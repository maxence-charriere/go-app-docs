name: build

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [build]

permissions:
  contents: write

concurrency:
  group: build-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-app-docs
    steps:
      - name: Checkout documentation
        uses: actions/checkout@v7
        with:
          ref: main
          path: go-app-docs

      - name: Resolve latest go-app tag
        id: go-app-version
        shell: bash
        run: |
          tag=$(git ls-remote --tags --refs --sort=-version:refname \
            https://github.com/maxence-charriere/go-app.git | \
            awk '!found && $2 ~ /^refs\/tags\/v[0-9]+\.[0-9]+\.[0-9]+$/ {
              sub(/^refs\/tags\//, "", $2)
              print $2
              found = 1
            }')
          if [ -z "$tag" ]; then
            echo "::error::No stable go-app version tag found."
            exit 1
          fi
          echo "Using go-app $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout tagged go-app
        uses: actions/checkout@v7
        with:
          repository: maxence-charriere/go-app
          ref: refs/tags/${{ steps.go-app-version.outputs.tag }}
          path: go-app
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go-app-docs/go.mod
          cache-dependency-path: |
            go-app-docs/go.sum
            go-app/go.sum

      - name: Install godoc
        run: go install golang.org/x/tools/cmd/godoc@latest

      - name: Build documentation and generate GitHub Pages
        run: make github GOAPP_DIR=../go-app

      - name: Commit and push generated website
        run: |
          git add --all -- docs
          if git diff --cached --quiet; then
            echo "No generated website changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update generated documentation"
          git push origin HEAD:main
